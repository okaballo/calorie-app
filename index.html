<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <!-- viewport-fit=cover lets the app draw under the iPhone notch / home bar -->
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#000000" />
    <meta name="color-scheme" content="dark light" />

    <!-- PWA -->
    <link rel="manifest" href="./manifest.json" />
    <link rel="icon" type="image/png" href="./icons/icon-192.png" />

    <!-- iOS "Add to Home Screen" support -->
    <link rel="apple-touch-icon" href="./icons/apple-touch-icon.png" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="KiBase" />

    <!-- Inter: the stand-in for SF Pro where it is missing (Windows, Android).
         Apple devices match SF first and never download the font files. -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:opsz,wght@14..32,400..800&display=swap" />

    <title>KiBase</title>

    <!-- Apply the saved theme before the first paint so there is no flash.
         "system" (the default) follows the device's light / dark setting.
         Neumorphism is English-only for now (Arabic shows it as Light, and
         Dark Neumorphism as plain Dark). -->
    <script>
      try {
        var theme = JSON.parse(localStorage.getItem("mt.theme") || "\"system\"")
        var lang = JSON.parse(localStorage.getItem("mt.lang") || "\"en\"")
        var dark = theme === "dark" || theme === "neumorphism-dark" || (theme === "system" && window.matchMedia("(prefers-color-scheme: dark)").matches)
        if (dark) document.documentElement.classList.add("dark")
        if ((theme === "neumorphism" || theme === "neumorphism-dark") && lang !== "ar") document.documentElement.classList.add("neu")
      } catch (e) { document.documentElement.classList.add("dark") }

      // The animated intro plays on every launch, unless Reduce Motion is on.
      if (!window.matchMedia("(prefers-reduced-motion: reduce)").matches) document.documentElement.classList.add("intro")
    </script>

    <!-- Launch screen: styled here so it paints before the app's JS and CSS
         arrive. Backgrounds match each theme's page. main.jsx removes it.
         The intro (.intro) builds the logo: the tile, then the chevrons rising
         bottom to top, then the spark. With Reduce Motion it just fades in. Each
         piece is its own <svg> so the browser can animate it on the compositor,
         smooth even while the app's JS loads. -->
    <style>
      #splash { position: fixed; inset: 0; z-index: 100; display: grid; place-items: center; background: #f7f7f8; pointer-events: none; }
      .dark #splash { background: #000; }
      .neu #splash { background: #e4e8ee; }
      .neu.dark #splash { background: #25282f; }
      .splash-logo { position: relative; width: 96px; height: 96px; animation: splash-fade 200ms ease-out both; }
      .splash-logo svg { position: absolute; inset: 0; }
      .splash-logo polyline { fill: none; stroke-width: 46; stroke-linecap: round; stroke-linejoin: round; }
      .intro .splash-logo { animation: splash-tile 900ms ease-out both; }
      .intro .splash-rise { animation: splash-rise 850ms cubic-bezier(.25, .1, .25, 1) both; }
      .intro .splash-spark { transform-origin: 50% 14.5%; animation: splash-spark 450ms cubic-bezier(.3, 1.6, .5, 1) 1550ms both; }
      @keyframes splash-fade { from { opacity: 0; } }
      @keyframes splash-tile { from { opacity: 0; transform: scale(.92); } }
      @keyframes splash-rise { from { opacity: 0; transform: translateY(16px); } }
      @keyframes splash-spark { from { opacity: 0; transform: scale(0); } }
    </style>
    <script type="module" crossorigin src="/calorie-app/assets/index-CPVJAj0r.js"></script>
    <link rel="stylesheet" crossorigin href="/calorie-app/assets/index-DGxKQ2Ei.css">
  </head>
  <body>
    <div id="root"></div>
    <div id="splash" aria-hidden="true">
      <!-- public/icons/icon.svg, inline so it needs no request -->
      <div class="splash-logo">
        <svg viewBox="0 0 512 512">
          <defs>
            <linearGradient id="splash-bg" x1="0" y1="0" x2="0" y2="1">
              <stop offset="0" stop-color="#1A0E33" />
              <stop offset="1" stop-color="#050407" />
            </linearGradient>
            <filter id="splash-glow" x="-40%" y="-80%" width="180%" height="260%">
              <feGaussianBlur stdDeviation="14" />
            </filter>
          </defs>
          <rect width="512" height="512" rx="114" fill="url(#splash-bg)" />
        </svg>
        <svg class="splash-rise" style="animation-delay: 350ms" viewBox="0 0 512 512">
          <polyline points="150,410 256,316 362,410" stroke="#4B2A8A" />
        </svg>
        <svg class="splash-rise" style="animation-delay: 500ms" viewBox="0 0 512 512">
          <polyline points="150,316 256,222 362,316" stroke="#7851A9" />
        </svg>
        <svg class="splash-rise" style="animation-delay: 650ms" viewBox="0 0 512 512">
          <polyline points="150,222 256,128 362,222" stroke="#B58CFF" filter="url(#splash-glow)" style="stroke-width: 52" />
          <polyline points="150,222 256,128 362,222" stroke="#EDE2FF" />
        </svg>
        <svg class="splash-spark" viewBox="0 0 512 512">
          <circle cx="256" cy="74" r="10" fill="#EDE2FF" />
        </svg>
      </div>
    </div>
  </body>
</html>
