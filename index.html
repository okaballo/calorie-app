<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <!-- viewport-fit=cover lets the app draw under the iPhone notch / home bar -->
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#000000" />
    <meta name="color-scheme" content="dark light" />

    <!-- PWA -->
    <link rel="manifest" href="./manifest.json" />
    <link rel="icon" type="image/png" href="./icons/icon-192.png" />

    <!-- iOS "Add to Home Screen" support -->
    <link rel="apple-touch-icon" href="./icons/apple-touch-icon.png" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="KiBase" />

    <!-- Inter: the stand-in for SF Pro where it is missing (Windows, Android).
         Apple devices match SF first and never download the font files. -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:opsz,wght@14..32,400..800&display=swap" />

    <title>KiBase</title>

    <!-- Apply the saved theme before the first paint so there is no flash.
         "system" (the default) follows the device's light / dark setting.
         Neumorphism is English-only for now (Arabic shows it as Light, and
         Dark Neumorphism as plain Dark). -->
    <script>
      try {
        var theme = JSON.parse(localStorage.getItem("mt.theme") || "\"system\"")
        var lang = JSON.parse(localStorage.getItem("mt.lang") || "\"en\"")
        var dark = theme === "dark" || theme === "neumorphism-dark" || (theme === "system" && window.matchMedia("(prefers-color-scheme: dark)").matches)
        if (dark) document.documentElement.classList.add("dark")
        if ((theme === "neumorphism" || theme === "neumorphism-dark") && lang !== "ar") document.documentElement.classList.add("neu")
      } catch (e) { document.documentElement.classList.add("dark") }
    </script>
    <script type="module" crossorigin src="/calorie-app/assets/index-Dpc_sOsE.js"></script>
    <link rel="stylesheet" crossorigin href="/calorie-app/assets/index-BwdgnZhm.css">
  </head>
  <body>
    <div id="root"></div>
  </body>
</html>
